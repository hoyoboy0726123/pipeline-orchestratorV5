# 範例 8:影片/語音 → Whisper 轉字幕 → AI 逐行校正 → 修正後 SRT
#
# 設計重點(逐筆語言判斷步的標準骨架):切分(recipe)→ 小批 map(live)→ 合併(recipe)。
#   transcribe / split_srt / merge_srt = 確定性步,已附 recipe → 重跑零-LLM、零成本。
#   correct_subtitles = subagent(proofreader),live → 每次重跑都用當前模型重新校正當下內容。
# 輸入:把影片/語音命名為 source.*(預設已附 source.mp3 範例音檔)放在本工作流輸出夾。
# 換成你自己的新影片:同樣命名 source.* 放進去 → 前後確定性步零成本、只有校正步重跑。

name: 影片轉字幕 + AI 逐行校正 (範例)
steps:
  - name: transcribe
    skill_mode: true
    batch: |
      在「目前工作目錄與其上層目錄」中尋找名為 source.* 的影音檔(例 source.mp3 / source.wav / source.m4a / source.mp4),
      從 cwd 開始往上層逐層搜尋(cwd → .. → ../..),找到第一個就用它。
      用 faster-whisper(WhisperModel，model_size="small"，language="zh"，beam_size=5)做語音轉錄，
      輸出「帶時間軸的標準 SRT」到 raw.srt（裸檔名、寫到目前工作目錄）。
      逐字稿原樣輸出、不做任何校正或改寫。每段含：序號(從1遞增)、時間軸(HH:MM:SS,mmm --> HH:MM:SS,mmm)、文字。
      只用公開可安裝的套件(faster-whisper)、用相對路徑、不要 import 任何專案內部模組。
    output:
      path: raw.srt
    timeout: 600
    expect: 產出合法的 raw.srt，含遞增序號、時間軸與逐字文字

  - name: split_srt
    skill_mode: true
    batch: |
      讀取 raw.srt，解析成一串字幕條目，每筆含三個欄位：index(整數序號)、time(時間軸字串，原樣)、text(文字，原樣)。
      不要修改任何文字、不要改動任何時間軸。
      每 20 筆切成一個 chunk，保留原始序號順序，寫成 chunks.json。
      格式：{"chunks": [{"id": 0, "items": [{"index": 1, "time": "...", "text": "..."}, ...]}, ...]}。
      用相對路徑讀 raw.srt、寫 chunks.json，不要 import 任何專案內部模組。
    output:
      path: chunks.json
    timeout: 300
    expect: chunks.json 內每筆條目的 index/time 與 raw.srt 完全一致、每塊最多 20 筆

  - name: correct_subtitles
    subagent: true
    subagent_role: proofreader
    batch: |
      讀取 chunks.json（結構：{"chunks":[{"id":int,"items":[{"index":int,"time":str,"text":str}]}]}）。
      逐塊（一次處理一塊、依 id 升序）對每筆字幕的 text 做「同音錯字校正 + 補上適當標點」：
      - 只改明顯的同音錯字與缺漏標點，語意不確定時保留原文。
      - index 與 time 一個字都不能動，原樣帶回。
      - 若某塊解析失敗或無法判斷，保留該塊原文，不要亂寫、不要刪除條目。
      輸出 chunks_corrected.json，schema 與輸入完全相同（{"chunks":[{"id":int,"items":[{"index":int,"time":str,"text":str}]}]}），
      條目總數與每筆的 index/time 必須與輸入一致。
      硬上限：最多把整份資料完整處理一輪即可，處理完直接輸出、不要反覆重試追求完美。
    output:
      path: chunks_corrected.json
    timeout: 600
    expect: chunks_corrected.json 條目數與每筆 index/time 與 chunks.json 一致、text 已校正

  - name: merge_srt
    skill_mode: true
    batch: |
      讀取 chunks_corrected.json，把所有 chunks 內的 items 攤平，依 index 升序排序，
      組回標準 SRT：每段為「序號 / 時間軸(原樣，用 item 的 time) / 文字(校正後) / 空行」。
      時間軸一律使用條目原本的 time 值，不要重算。輸出 corrected.srt。
      用相對路徑讀 chunks_corrected.json、寫 corrected.srt，不要 import 任何專案內部模組。
    output:
      path: corrected.srt
    timeout: 300
    expect: corrected.srt 為合法 SRT、序號連續升序、時間軸與 raw.srt 一致
