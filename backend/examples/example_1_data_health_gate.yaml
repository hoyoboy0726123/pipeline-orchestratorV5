# 範例工作流:資料健檢閘門
# ───────────────────────────────────────────────────────────────
# 示範重點:condition 節點(IF 模式)如何跟 script 節點結合。
# 情境:跑一次資料健檢,依「異常筆數」決定要走「人工複查」還是「直接歸檔」。
# 這是很常見的「品質閘門」模式 —— 跑完一步先檢查結果、再決定往哪條路走。
#
# 關鍵觀念:condition 節點只能讀 script 步驟 print 出來的 stdout。
#   所以一定要有一個 script 步驟先把「判斷值」算出來、print 出來,
#   condition 再用 {{ steps.<該步>.output.stdout }} 引用。
# ───────────────────────────────────────────────────────────────
name: 資料健檢閘門 (範例)
validate: false
steps:
  # 1) 產生一批模擬資料(實務上這裡會換成「讀你真正的資料檔」)
  - name: 產生範例資料
    batch: |
      python -c "import json,random; data=[{'id':i,'value':random.randint(0,110)} for i in range(30)]; json.dump(data,open('data.json','w'))"
    output:
      path: data.json
    timeout: 60

  # 2) 把「判斷值」(異常筆數)算出來、print 成 stdout
  - name: 統計異常筆數
    batch: |
      python -c "import json; d=json.load(open('data.json')); print(sum(1 for x in d if x['value']>100))"
    timeout: 60

  # 3) 條件節點(IF):異常筆數 > 2 → 複查;否則 → 歸檔
  - name: 判斷是否需複查
    condition: true
    expression: "{{ steps.統計異常筆數.output.stdout | int > 2 }}"
    on_true: 產生複查清單
    on_false: 產生健檢報告

  # 4) true 分支:列出異常資料供人工複查
  - name: 產生複查清單
    batch: |
      python -c "import json; d=json.load(open('data.json')); bad=[x for x in d if x['value']>100]; open('review_list.txt','w',encoding='utf-8').write('需複查 %d 筆:\n'%len(bad)+'\n'.join('  id=%d  value=%d'%(x['id'],x['value']) for x in bad))"
    output:
      path: review_list.txt
    next: end
    timeout: 60

  # 5) false 分支:健檢通過、寫一份簡短報告
  - name: 產生健檢報告
    batch: |
      python -c "import json; d=json.load(open('data.json')); open('ok_report.txt','w',encoding='utf-8').write('健檢通過:共 %d 筆資料、異常數在容忍範圍內。'%len(d))"
    output:
      path: ok_report.txt
    timeout: 60
